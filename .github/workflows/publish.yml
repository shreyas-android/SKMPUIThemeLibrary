name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest # Changed to ubuntu-latest for general efficiency

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      # Cache Gradle dependencies for faster subsequent builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # The convention plugin signs with the classic Gradle signing plugin, which needs a
      # BINARY secret keyring FILE. Derive it from the existing armored SIGNING_KEY secret
      # (gpg --dearmor converts the ASCII-armored private key into the binary keyring).
      - name: Materialize GPG secret keyring
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | gpg --dearmor > "$GITHUB_WORKSPACE/secring.gpg"

      - name: Publish to Maven Central
        env:
          # Central Portal credentials — read by the Vanniktech publish plugin as Gradle
          # project properties (hence the ORG_GRADLE_PROJECT_ prefix).
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}

          # Signing — the convention plugin reads these exact env var names and wires them
          # to the classic signing plugin (signing.keyId / password / secretKeyRingFile).
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEY_RING_FILE: ${{ github.workspace }}/secring.gpg

        # Uploads to a staging repo and releases it to Maven Central in one step.
        run: ./gradlew clean publishAndReleaseToMavenCentral --no-daemon --stacktrace