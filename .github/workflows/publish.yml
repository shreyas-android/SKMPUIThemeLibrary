name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest # Changed to ubuntu-latest for general efficiency

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      # Cache Gradle dependencies for faster subsequent builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # NOTE: The manual GPG key import step was removed because module-build.gradle.kts
      # uses useInMemoryPgpKeys() and reads the key from the SIGNING_KEY environment variable.

      - name: Publish to Maven Central
        env:
          # The maven-publish convention plugin (Vanniktech-based) reads these as Gradle
          # project properties, so they must be passed via ORG_GRADLE_PROJECT_ env vars.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}

          # In-memory GPG signing key (armored private key) and its passphrase.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

        # Uploads to a staging repo and releases it to Maven Central in one step.
        run: ./gradlew clean publishAndReleaseToMavenCentral --no-daemon --stacktrace