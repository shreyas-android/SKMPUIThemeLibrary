name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest # Changed to ubuntu-latest for general efficiency

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # Cache Gradle dependencies for faster subsequent builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # NOTE: The manual GPG key import step was removed because module-build.gradle.kts
      # uses useInMemoryPgpKeys() and reads the key from the SIGNING_KEY environment variable.

      - name: Publish to Maven Central
        env:
          # Nexus/Sonatype Credentials (read by root-build.gradle.kts via System.getenv)
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}

          # Signing Credentials (read by module-build.gradle.kts via System.getenv)
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

        # Task corrected from 'publishAllPublicationsToMavenCentralRepository' to 'publishAllPublicationsToSonatype'
        run: ./gradlew clean publishAllPublicationsToSonatype --no-daemon --stacktrace