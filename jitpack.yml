jdk:
  - openjdk17

install:
  # Install Node.js for wasmJs + browser
  - curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
  - sudo apt-get install -y nodejs
  - npm install --global yarn

  - node -v
  - npm -v
  - yarn -v

  # Always publish these (they exist on Linux)
  - ./gradlew --no-daemon --stacktrace publishKotlinMultiplatformPublicationToMavenLocal
  - ./gradlew --no-daemon --stacktrace publishJvmPublicationToMavenLocal
  - ./gradlew --no-daemon --stacktrace publishWasmJsPublicationToMavenLocal
  - ./gradlew --no-daemon --stacktrace publishAndroidReleasePublicationToMavenLocal

  # Conditionally publish iOS artifacts (only if tasks exist)
  - if ./gradlew tasks | grep -q publishIosArm64PublicationToMavenLocal; then ./gradlew publishIosArm64PublicationToMavenLocal; fi
  - if ./gradlew tasks | grep -q publishIosX64PublicationToMavenLocal; then ./gradlew publishIosX64PublicationToMavenLocal; fi
  - if ./gradlew tasks | grep -q publishIosSimulatorArm64PublicationToMavenLocal; then ./gradlew publishIosSimulatorArm64PublicationToMavenLocal; fi
